; Dimensionamento do pool para o evento.
;
; A imagem oficial vem com pm.max_children = 5, que é o default para um site
; comum. Aqui são ~152 requisições por segundo em regime permanente: 150
; celulares + telão + painel master, todos com poll de 1 em 1 segundo. Com 5
; workers, qualquer request que passe de ~33ms começa a formar fila — e a fila
; num evento ao vivo aparece como cronômetro travado na mão do participante.
;
; php-fpm.d/*.conf é lido em ordem alfabética, então este arquivo carrega
; depois de docker.conf e www.conf e é ele que vale. `listen` e `clear_env`
; já vêm corretos do docker.conf da imagem e por isso não são repetidos aqui.

[www]

; static: os workers sobem junto com o container e ficam de pé. O evento inteiro
; dura 20 minutos — não há por que pagar fork no meio de uma rodada, nem deixar
; o pm encolher o pool no intervalo entre as fases justamente para ter de
; reabrir tudo quando a próxima votação abrir.
pm = static
pm.max_children = 32

; ~40MB por worker neste app, então 32 x 40MB ≈ 1.3GB — folgado num servidor de
; 4GB junto com o Postgres. Numa VPS de 2GB, baixe para 16: ainda é bem mais que
; o pico esperado (com 20ms por request, 152 req/s ocupam ~3 workers de fato; o
; resto é margem para picos e para o Postgres respondendo devagar).

; 0 = worker nunca recicla. O opcache está com validate_timestamps=0 e o código
; não muda enquanto o evento roda; reciclar worker só jogaria fora cache quente.
pm.max_requests = 0

; casa com o fastcgi_read_timeout do nginx: um request que passou disso já foi
; abandonado pelo outro lado, segurar o worker não ajuda ninguém.
request_terminate_timeout = 30s
